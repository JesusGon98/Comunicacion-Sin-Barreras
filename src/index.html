<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Comunicación entre personas oyentes y personas sordas: voz, texto y Lengua de Señas Mexicana." />

    <!-- Íconos (se generan con: npm run icons) -->
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- PWA: se puede instalar en el celular como una app -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iPhone: Compartir → "Agregar a inicio" la abre a pantalla completa -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sin Barreras" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Comunicación sin Barreras</title>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
