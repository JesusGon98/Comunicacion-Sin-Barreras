<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>

    @case ('chat') {
      <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z" />
    }
    @case ('hand') {
      <path d="M8 13V5a1.5 1.5 0 0 1 3 0v6" />

      <path d="M12 18v3" />

    @case ('mic-off') {
      <path d="M15 9.3V6a3 3 0 0 0-5.7-1.3" />

      <path d="M19 6a8.5 8.5 0 0 1 0 12" />

      <circle cx="12" cy="12" r="3" />

      <path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <path d="M9 12.5a3 3 0 0 1 5.2-2" />
      <path d="M14.5 8.5v2h-2" />
      <path d="M15 13.5a3 3 0 0 1-5.2 2" />
      <path d="M9.5 17.5v-2h2" />
    }
    @case ('power') {
      <path d="M12 3v9" />
      <path d="M6.3 6.3a8 8 0 1 0 11.4 0" />
    }
    @case ('backspace') {
      <path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z" />
      <path d="M13 9.5l5 5" />
      <path d="M18 9.5l-5 5" />

      <path d="M4 7h16" />
      <path d="M9 7V4h6v3" />
      <path d="M6 7l1 13h10l1-13" />

      <path d="M4 9V4h5" />
      <path d="M20 9V4h-5" />

      <path d="M20 15v5h-5" />

      <path d="M18 7h2" />

      <path d="M4 17h4" />
      <path d="M12 17h8" />
      <circle cx="10" cy="17" r="2" />

    @case ('download') {
      <path d="M12 3v12" />
      <path d="M7 10l5 5 5-5" />
      <path d="M5 21h14" />
    }
    @case ('upload') {
      <path d="M12 15V3" />
      <path d="M7 8l5-5 5 5" />
      <path d="M5 21h14" />
    }
    @case ('send') {
      <path d="M4 12l16-8-6 16-2.5-6.5z" />
      <path d="M11.5 13.5L20 4" />

    @case ('play') {
      <path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z" fill="currentColor" />

    @case ('pause') {
      <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor" />
      <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor" />
    }
    @case ('prev') {
      <path d="M15 5l-7 7 7 7" />
    }
    @case ('next') {
      <path d="M9 5l7 7-7 7" />
    }
    @case ('repeat') {
      <path d="M4 12a8 8 0 1 0 2.4-5.7" />
      <path d="M4 4v4h4" />
    }
    @case ('flip') {
      <path d="M12 3v18" />
      <path d="M8 7L3 12l5 5z" />
      <path d="M16 7l5 5-5 5z" />

      <path d="M6 6l12 12" />
      <path d="M18 6L6 18" />

    @case ('edit') {
      <path d="M4 20h4L19 9l-4-4L4 16z" />
      <path d="M13.5 6.5l4 4" />
    }
    @case ('plus') {
      <path d="M12 5v14" />
      <path d="M5 12h14" />
    }
    @case ('check') {
      <path d="M5 12.5l4.5 4.5L19 7" />
    }
    @case ('info') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 11v5" />
      <path d="M12 8h.01" />
    }
    @case ('stop') {
      <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" />
    }
    @case ('refresh') {
      <path d="M20 12a8 8 0 1 1-2.4-5.7" />
      <path d="M20 4v4h-4" />
    }
    @case ('chevron-down') {
      <path d="M6 9l6 6 6-6" />
    }
    @case ('sparkle') {
      <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z" />
      <path d="M19 16l.7 1.8 1.8.7-1.8.7L19 21l-.7-1.8-1.8-.7 1.8-.7z" />
    }
    @case ('record') {
      <circle cx="12" cy="12" r="7" fill="currentColor" />
    }
  }
